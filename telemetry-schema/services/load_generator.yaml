file_format: definition/2
attribute_groups:
  - id: service.load_generator
    visibility: public
    brief: Load Generator attributes
    stability: stable
    attributes:
      - ref: session.id
      - ref: demo.synthetic_request
      - ref: user.id
      - ref: demo.request.flood.count
      - ref: demo.product.id
      - ref: demo.product.quantity
      - ref: demo.ad.category
      - ref: demo.cart.items.count
      - ref: gen_ai.input.messages
      - ref: demo.user_context.tier
      - ref: demo.user_context.country
      - ref: demo.user_context.region
      - ref: demo.client.platform
      - ref: demo.payment.method
      - ref: demo.payment.card_type
      - ref: demo.payment.wallet_provider
      - ref: demo.shipping.delivery_method
      - ref: demo.shipping.carrier
