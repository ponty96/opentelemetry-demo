file_format: definition/2
attribute_groups:
  - id: service.checkout
    visibility: public
    brief: Checkout service attributes
    stability: stable
    attributes:
      - ref: user_agent.synthetic.type
      - ref: user.id
      - ref: user.email
      - ref: user.hash
      - ref: demo.user_context.selected_currency
      - ref: demo.payment.transaction.id
      - ref: demo.payment.card_number
      - ref: demo.payment.card_cvv
      - ref: demo.shipping.tracking.id
      - ref: demo.order.id
      - ref: demo.shipping.amount
      - ref: demo.order.amount
      - ref: demo.order.items.count
      - ref: demo.cart.items.count
      - ref: demo.user_context.tier
      - ref: demo.user_context.country
      - ref: demo.user_context.region
      - ref: demo.client.platform
      - ref: demo.payment.method
      - ref: demo.payment.card_type
      - ref: demo.payment.wallet_provider
      - ref: demo.shipping.delivery_method
      - ref: demo.shipping.carrier
