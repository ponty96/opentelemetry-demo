    visibility: public
    brief: Payment service attributes
    stability: stable
    attributes:
      - ref: user_agent.synthetic.type
      - ref: enduser.id
      - ref: demo.user_context.loyalty_level
      - ref: demo.payment.card_type
      - ref: demo.payment.card_valid
      - ref: demo.payment.card_number
      - ref: demo.payment.card_cvv
      - ref: demo.payment.charged
      - ref: demo.payment.amount
      - ref: user.id
      - ref: demo.user_context.tier
      - ref: demo.user_context.country
      - ref: demo.user_context.region
      - ref: demo.client.platform
      - ref: demo.payment.method
      - ref: demo.payment.wallet_provider
      - ref: demo.shipping.delivery_method
      - ref: demo.shipping.carrier
